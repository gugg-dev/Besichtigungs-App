  const asAkt = (it, status) => ({ id:it.id, name:it.name, status, mod:it.lastModifiedDateTime, ...parseAktName(it.name) });

    const direkt = ks.filter(x => x.folder).map(x => asAkt(x, status));

/* ---------- Foto-Warteschlange (IndexedDB, übersteht Funklöcher) ---------- */
const Queue = (() => {
  let db = null, running = false, cloud = null; const subs = new Set(); let count = 0, lastError = '';
  const open = () => db ? Promise.resolve(db) : new Promise((res, rej) => { const r = indexedDB.open('sfvo_queue', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos', { keyPath:'id' }); r.onsuccess = () => { db = r.result; res(db); }; r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction('fotos', mode), s = t.objectStore('fotos'); const rq = fn(s); t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); }); };
  const emit = () => subs.forEach(f => f({ count, lastError, running }));
  const refresh = async () => { try { count = (await tx('readonly', s => s.getAllKeys())).length; } catch (e) { count = 0; } emit(); };
  const run = async () => {
    if (running || !cloud) return; running = true; emit();
    try {
      for (;;) {
        const all = await tx('readonly', s => s.getAll()); if (!all.length) break;
        const it = all.sort((a, b) => a.ts - b.ts)[0];
        try { const fo = await subFolder(cloud, it.aktId, F_FOTO); await cloud.put(fo, it.name, it.blob, it.blob.type || 'image/jpeg', 'rename'); await tx('readwrite', s => s.delete(it.id)); lastError = ''; subs.forEach(f => f({ count:--count, lastError, running, done:it })); }
        catch (e) { lastError = e.message || String(e); break; }
      }
    } finally { running = false; await refresh(); }
  };
  window.addEventListener('online', () => run()); setInterval(() => { if (count) run(); }, 20000);
  return {
    setCloud(c) { cloud = c; refresh().then(run); },
    async add(aktId, name, blob) { await tx('readwrite', s => s.put({ id:uid(), ts:Date.now(), aktId, name, blob })); count++; emit(); run(); },
    sub(f) { subs.add(f); f({ count, lastError, running }); return () => subs.delete(f); }, run
  };
})();

function Chips({ options, value, onChange, multi = false, frei = false, klein = false }) {
  const [neu, setNeu] = useState(null);
  const vals = multi ? (value || []) : (value ? [value] : []);
  const alle = options.concat(vals.filter(v => !options.includes(v)));
  const tog = o => multi ? onChange(vals.includes(o) ? vals.filter(x => x !== o) : vals.concat(o)) : onChange(value === o ? '' : o);
  const fertig = () => { const t = (neu || '').trim(); setNeu(null); if (t && !vals.includes(t)) multi ? onChange(vals.concat(t)) : onChange(t); };
  return html`<div className=${'chips' + (klein ? ' klein' : '')}>
    ${alle.map(o => html`<button type="button" key=${o} className=${'chip' + (vals.includes(o) ? ' on' : '')} aria-pressed=${vals.includes(o)} onClick=${() => tog(o)}>${o}</button>`)}
    ${frei && (neu === null
      ? html`<button type="button" className="chip dash" onClick=${() => setNeu('')}>+ Eigene Angabe</button>`
      : html`<input className="chip-inp" autoFocus=${true} value=${neu} placeholder="Eigene Angabe …" onChange=${e => setNeu(e.target.value)} onBlur=${fertig} onKeyDown=${e => e.key === 'Enter' && fertig()} />`)}
  </div>`;
}
const Seg = ({ options, value, onChange }) => html`<div className="seg" role="group">${options.map(o => html`<button type="button" key=${o} className=${value === o ? 'on' : ''} aria-pressed=${value === o} onClick=${() => onChange(value === o ? '' : o)}>${o}</button>`)}</div>`;
const Feld = ({ label, hint, children, pflicht }) => html`<div className="feld"><div className="lab">${label}${pflicht && html`<span className="pfl"> · Pflicht</span>`}</div>${children}${hint && html`<div className="hint">${hint}</div>`}</div>`;
function Text({ value, onChange, placeholder, rows = 3, label }) {
  const ref = useRef(null);
  useEffect(() => { const t = ref.current; if (t) { t.style.height = 'auto'; t.style.height = Math.max(t.scrollHeight + 2, rows * 26) + 'px'; } }, [value]);
  return html`<textarea ref=${ref} aria-label=${label || placeholder} className="inp area" rows=${rows} value=${value || ''} placeholder=${placeholder || 'Tippen oder über das Mikrofon der Tastatur diktieren …'} onChange=${e => onChange(e.target.value)} />`;
}
const Inp = ({ value, onChange, placeholder, type = 'text', mode, label, klasse = '' }) => html`<input className=${'inp ' + klasse} aria-label=${label || placeholder} type=${type} inputMode=${mode} value=${value || ''} placeholder=${placeholder || ''} onChange=${e => onChange(e.target.value)} />`;
const Karte = ({ titel, rechts, children, klasse = '' }) => html`<section className=${'karte ' + klasse}>${(titel || rechts) && html`<div className="karte-kopf"><h3>${titel}</h3>${rechts}</div>`}${children}</section>`;
const Btn = ({ children, onClick, art = '', disabled, icon }) => html`<button type="button" className=${'btn ' + art} disabled=${disabled} onClick=${onClick}>${icon && html`<${Icon} n=${icon} s=${18} />`}${children}</button>`;

function Skizze({ value, onChange }) {
  const ref = useRef(null), zeichnet = useRef(false), [offen, setOffen] = useState(!!value);
  useEffect(() => { if (!offen) return; const c = ref.current, x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); if (value) { const im = new Image(); im.onload = () => x.drawImage(im, 0, 0); im.src = value; } }, [offen]);
  const pos = e => { const r = ref.current.getBoundingClientRect(); return [(e.clientX - r.left) * ref.current.width / r.width, (e.clientY - r.top) * ref.current.height / r.height]; };
  const down = e => { zeichnet.current = true; ref.current.setPointerCapture(e.pointerId); const x = ref.current.getContext('2d'); x.lineWidth = 3; x.lineCap = 'round'; x.strokeStyle = '#12171B'; x.beginPath(); x.moveTo(...pos(e)); };
  const move = e => { if (!zeichnet.current) return; const x = ref.current.getContext('2d'); x.lineTo(...pos(e)); x.stroke(); };
  const up = () => { if (!zeichnet.current) return; zeichnet.current = false; onChange(ref.current.toDataURL('image/png')); };
  const leer = () => { const c = ref.current, x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); onChange(null); };
  if (!offen) return html`<${Btn} icon="pen" onClick=${() => setOffen(true)}>Skizze zeichnen<//>`;
  return html`<div className="skizze"><canvas ref=${ref} width="1200" height="760" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up} />
    <div className="zeile"><span className="hint">Mit Finger oder Stift zeichnen. Die Skizze kommt ins Word-Protokoll.</span><${Btn} onClick=${leer}>Leeren<//></div></div>`;
}

function SecRaeume({ f, mut, go, fotos }) {
  const [neuIn, setNeuIn] = useState(null);
  const addRaum = (ei, bez) => { const r = neuerRaum(bez, f.einheiten[ei].geschoss || 'EG'); mut(d => { d.einheiten[ei].raeume.push(r); }); setNeuIn(null); go('raum:' + r.id); };
  return html`<${React.Fragment}>
    ${f.einheiten.map((e, ei) => html`<${Karte} key=${e.id} klasse="einheit">
      <div className="einheit-kopf">
        <input className="inp titel" aria-label="Bezeichnung der Einheit" value=${e.bez} placeholder=${f.einheiten.length > 1 ? 'Bezeichnung, z. B. Top 3' : 'Einheit (optional, z. B. Top 3)'} onChange=${ev => mut(d => { d.einheiten[ei].bez = ev.target.value; })} />
        <${Chips} options=${GESCHOSSE} value=${e.geschoss} onChange=${v => mut(d => { d.einheiten[ei].geschoss = v; })} klein=${true} />
        ${f.einheiten.length > 1 && !e.raeume.length && html`<button className="rund" aria-label="Einheit entfernen" onClick=${() => mut(d => { d.einheiten.splice(ei, 1); })}><${Icon} n="trash" s=${18} /></button>`}
      </div>
      <div className="raster3">
        ${e.raeume.map(r => { const w = raumW(r), n = fotos.filter(x => x.name.startsWith(fotoPrefix(f, e, r) + ' - ')).length, akt = BAUTEILE.filter(b => r.bauteile[b.key].aktiv);
          return html`<button key=${r.id} className=${'karte raumk ' + (raumFertig(r) ? 'ok' : '')} onClick=${() => go('raum:' + r.id)}>
            <div className="zeile zw"><b>${raumTitel(r)}</b>${r.ursacheHier && html`<span className="tag blau">Ursache</span>`}</div>
            ${r.nichtBetroffen ? html`<span className="hint">nicht betroffen</span>` : html`<${React.Fragment}>
              <span className=${w.boden ? 'hint' : 'hint gelbt'}>${w.boden ? de(r.l) + ' × ' + de(r.b) + ' m · ' + de(w.boden) + ' m²' : 'Maße fehlen'}</span>
              <div className="chips klein lesen">${akt.length ? akt.map(b => html`<span key=${b.key} className="tag">${b.label}</span>`) : html`<span className="hint gelbt">noch kein Bauteil</span>`}</div><//>`}
            <span className=${raumFertig(r) ? 'hint gruent' : 'hint'}>${n} Foto(s)${raumFertig(r) ? ' · vollständig' : ''}</span>
          </button>`; })}
      </div>
      ${neuIn === ei
        ? html`<div className="neu-raum"><div className="lab">Welcher Raum?</div><${Chips} options=${RAEUME} value="" onChange=${v => v && addRaum(ei, v)} frei=${true} /><${Btn} onClick=${() => setNeuIn(null)}>Abbrechen<//></div>`
        : html`<button className="btn dash breit" onClick=${() => setNeuIn(ei)}><${Icon} n="plus" /> Raum hinzufügen</button>`}
      <${Feld} label="Feststellung zur Einheit (optional)"><${Text} value=${e.notiz} onChange=${v => mut(d => { d.einheiten[ei].notiz = v; })} rows=${2} /><//>
      <${Skizze} value=${e.skizze} onChange=${v => mut(d => { d.einheiten[ei].skizze = v; })} />
    <//>`)}
    <${Btn} icon="plus" onClick=${() => mut(d => { d.einheiten.push(neueEinheit('')); })}>Weitere Einheit (Wohnung, Top)<//>
  <//>`;
}

function LvSuche({ r, onAdd, onClose }) {
  const [q, setQ] = useState(''), w = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const tr = w.length ? LV_FLACH.filter(x => w.every(t => (x.detail + ' ' + x.gewerk + ' ' + x.code).toLowerCase().includes(t))).slice(0, 40) : [];
  return html`<div className="sheet-bg" onClick=${e => e.target === e.currentTarget && onClose()}><div className="sheet hoch">
    <div className="karte-kopf"><h3>Leistung suchen</h3><button className="rund" aria-label="Schließen" onClick=${onClose}><${Icon} n="x" /></button></div>
    <input className="inp" autoFocus=${true} aria-label="Suchbegriff" placeholder="z. B. Parkett, Fliesen, Gipskarton, Malerei …" value=${q} onChange=${e => setQ(e.target.value)} />
    <div className="liste">${tr.map(x => html`<button key=${x.code} className="lv-zeile" onClick=${() => { onAdd(x); }}><span className="mono">${x.code}</span><span>${x.detail}<small> · ${x.gewerk} · ${x.einheit}</small></span></button>`)}
      ${w.length > 0 && !tr.length && html`<div className="hint">Nichts gefunden.</div>`}
      ${!w.length && html`<div className="hint">${LV_FLACH.length} Positionen aus dem Sanierungs-LV. Mehrere Wörter grenzen ein.</div>`}</div>
    <${Btn} onClick=${() => { const t = q.trim(); if (t) { onAdd({ code:'', detail:t, kurz:t, einheit:'Pau.' }); } }} disabled=${!q.trim()}>„${q.trim() || '…'}“ als freie Leistung übernehmen<//>
  </div></div>`;
}

function RaumView({ f, mut, rid, go, fotos, onKamera, queue }) {
  const hit = alleRaeume(f).find(x => x.r.id === rid), [bt, setBt] = useState(''), [suche, setSuche] = useState(false), [gross, setGross] = useState(null);
  if (!hit) return html`<div className="hint">Raum nicht gefunden.</div>`;
  const { e, ei, r } = hit, ri = e.raeume.indexOf(r), w = raumW(r), pre = fotoPrefix(f, e, r);
  const m = fn => mut(d => { fn(d.einheiten[ei].raeume[ri]); });
  const meine = fotos.filter(x => x.name.startsWith(pre + ' - '));
  const aktiv = BAUTEILE.filter(b => r.bauteile[b.key].aktiv), offen = bt && r.bauteile[bt].aktiv ? bt : (aktiv[0] && aktiv[0].key) || '';
  const tog = k => { if (!r.bauteile[k].aktiv) m(x => { x.bauteile[k].aktiv = true; }); setBt(k); };
  const raus = k => { m(x => { x.bauteile[k].aktiv = false; }); setBt(''); };
  const vor = lvVorschlaege(r), addL = (x, art) => m(y => { y.leistungen.push({ id:uid(), code:x.code, detail:x.detail, kurz:x.kurz, einheit:x.einheit, bauteil:x.bauteil || offen, menge:lvMenge(r, { ...x, bauteil:x.bauteil || offen }), art:art || 'Folgeschaden' }); });
  const B = offen ? BT[offen] : null, X = offen ? r.bauteile[offen] : null;
  return html`<div className="raum">
    <div className="raum-links">
      <${Karte} titel="Raum">
        <${Chips} options=${RAEUME.slice(0, 10)} value=${r.bez} onChange=${v => v && m(x => { x.bez = v; })} frei=${true} klein=${true} />
        <${Feld} label="Geschoss"><${Chips} options=${GESCHOSSE} value=${r.geschoss} onChange=${v => m(x => { x.geschoss = v; })} klein=${true} /><//>
        <div className="masse">${[['l', 'Länge m'], ['b', 'Breite m'], ['h', 'Höhe m']].map(([k, l]) => html`<label key=${k}>${l}<input className="inp zahl" inputMode="decimal" value=${r[k]} placeholder="0,00" onChange=${ev => m(x => { x[k] = ev.target.value.replace(/[^\d.,]/g, ''); })} /></label>`)}</div>
        <div className="summen"><span>Boden <b>${de(w.boden)} m²</b></span><span>Wände <b>${de(w.wand)} m²</b></span><span>Umfang <b>${de(w.umfang)} lfm</b></span></div>
        <div className="zeile wrap">
          <button type="button" className=${'chip' + (r.ursacheHier ? ' on' : '')} aria-pressed=${r.ursacheHier} onClick=${() => m(x => { x.ursacheHier = !x.ursacheHier; })}>Ort der Ursache</button>
          <button type="button" className=${'chip' + (r.nichtBetroffen ? ' on' : '')} aria-pressed=${r.nichtBetroffen} onClick=${() => m(x => { x.nichtBetroffen = !x.nichtBetroffen; })}>Nicht betroffen</button>
        </div>
      <//>
      <${Karte} titel="Fotos" rechts=${html`<span className="tag gruen">${meine.length}${queue.count ? ' · ' + queue.count + ' laden' : ''}</span>`}>
        <button className="btn dunkel breit" onClick=${() => onKamera(r.id)}><${Icon} n="cam" /> Hier fotografieren</button>
        <div className="thumbs">${meine.slice(-12).map(x => html`<button key=${x.id} className="thumb" aria-label=${x.name} onClick=${() => setGross(x)}>${x.thumb ? html`<img src=${x.thumb} alt="" loading="lazy" />` : html`<${Icon} n="img" />`}</button>`)}</div>
        <div className="hint">Das iPhone fotografiert automatisch in diesen Raum, solange er hier offen ist. Dateiname beginnt mit „${pre}“.</div>
      <//>
    </div>
    <div className="raum-rechts">
      ${r.nichtBetroffen ? html`<${Karte} titel="Nicht betroffen"><p>Der Raum wurde besichtigt und ist nicht betroffen.</p><${Feld} label="Feststellung (optional)"><${Text} value=${r.feststellung} onChange=${v => m(x => { x.feststellung = v; })} rows=${2} /><//><//>` : html`<${React.Fragment}>
        <div className="bt-leiste">${BAUTEILE.map(b => html`<button key=${b.key} type="button" className=${'bt' + (r.bauteile[b.key].aktiv ? ' aktiv' : '') + (offen === b.key ? ' offen' : '')} aria-pressed=${r.bauteile[b.key].aktiv} onClick=${() => tog(b.key)}>
          ${b.label}<small>${r.bauteile[b.key].aktiv ? 'betroffen' : 'antippen'}</small></button>`)}</div>
        ${B ? html`<${Karte} titel=${B.label} rechts=${html`<${Btn} icon="x" onClick=${() => raus(offen)}>Doch nicht betroffen<//>`}>
          <${Feld} label=${B.matLabel}><${Chips} options=${B.mats} value=${X.mat} multi=${true} frei=${true} onChange=${v => m(x => { x.bauteile[offen].mat = v; })} /><//>
          <${Feld} label="Schadenbild"><${Chips} options=${B.bilder} value=${X.bilder} multi=${true} frei=${true} onChange=${v => m(x => { x.bauteile[offen].bilder = v; })} /><//>
          ${B.einheit && html`<${Feld} label=${'Betroffene Menge (' + B.einheit + ')'} hint=${B.einheit === 'Stk' ? '' : 'Leer lassen = ganze Fläche aus den Raummaßen (' + de(btMenge({ ...r, bauteile:{ ...r.bauteile, [offen]:{ ...X, menge:'' } } }, offen)) + ' ' + B.einheit + ').'}>
            <input className="inp zahl kurz" inputMode="decimal" aria-label="Betroffene Menge" value=${X.menge} placeholder=${B.einheit === 'Stk' ? '1' : 'ganz'} onChange=${ev => m(x => { x.bauteile[offen].menge = ev.target.value.replace(/[^\d.,]/g, ''); })} /><//>`}
          <${Feld} label=${'Ergänzende Feststellung ' + B.label}><${Text} value=${X.text} onChange=${v => m(x => { x.bauteile[offen].text = v; })} rows=${2} /><//>
        <//>` : html`<div className="leer">Oben antippen, was in diesem Raum betroffen ist.</div>`}
        <${Karte} titel="Feststellung des SV im Raum"><${Text} value=${r.feststellung} onChange=${v => m(x => { x.feststellung = v; })} placeholder="Freier Text zum Raum: Befund, Besonderheiten, was wer saniert …" /><//>
        ${r.ursacheHier && html`<${Karte} titel="Ursachenbehebung in diesem Raum">
          <${Feld} label="Stand"><${Seg} options=${STAND_OPTS} value=${r.ursachenbehebungStand} onChange=${v => m(x => { x.ursachenbehebungStand = v; })} /><//>
          <${Feld} label="Was wurde gemacht oder ist nötig, von wem"><${Text} value=${r.ursachenbehebung} onChange=${v => m(x => { x.ursachenbehebung = v; })} rows=${2} placeholder="z. B. Schlauch durch Installateur getauscht, ausgebautes Teil lag vor" /><//>
        <//>`}
        <${Karte} titel="Leistungen für die Schadenberechnung" rechts=${html`<${Btn} icon="search" onClick=${() => setSuche(true)}>Suchen<//>`}>
          ${r.leistungen.map((x, li) => html`<div key=${x.id} className="leistung">
            <div className="l-text"><b>${x.detail || x.kurz}</b><small>${[x.code, x.einheit].filter(Boolean).join(' · ')}</small></div>
            <input className="inp zahl kurz" inputMode="decimal" aria-label="Menge" value=${x.menge} onChange=${ev => m(y => { y.leistungen[li].menge = ev.target.value.replace(/[^\d.,]/g, ''); })} />
            <button type="button" className=${'chip klein-chip' + (x.art === 'Ursachenbehebung' ? ' on' : '')} onClick=${() => m(y => { y.leistungen[li].art = x.art === 'Ursachenbehebung' ? 'Folgeschaden' : 'Ursachenbehebung'; })}>${x.art === 'Ursachenbehebung' ? 'Ursache' : 'Folge'}</button>
            <button className="rund" aria-label="Leistung entfernen" onClick=${() => m(y => { y.leistungen.splice(li, 1); })}><${Icon} n="x" s=${18} /></button></div>`)}
          ${vor.length > 0 && html`<div className="vorschlag"><div className="eyebrow">VORSCHLÄGE AUS DEM SANIERUNGS-LV · ANTIPPEN ÜBERNIMMT</div>
            ${vor.map(x => html`<button key=${x.code} className="lv-zeile" onClick=${() => addL(x)}><span className="mono">${x.code}</span><span>${x.detail}<small> · ${lvMenge(r, x)} ${x.einheit}</small></span></button>`)}</div>`}
          ${!vor.length && !r.leistungen.length && html`<div className="hint">Vorschläge erscheinen, sobald Bauteil, Belag und Maße erfasst sind. Jede Position lässt sich auch über „Suchen“ wählen.</div>`}
        <//>
      <//>`}
      <div className="zeile zw"><${Btn} icon="trash" onClick=${() => { if (confirm('Raum „' + raumTitel(r) + '“ löschen? Fotos im Akt bleiben erhalten.')) { mut(d => { d.einheiten[ei].raeume.splice(ri, 1); }); go('raeume'); } }}>Raum löschen<//>
        <${Btn} art="prim" icon="check" onClick=${() => go('raeume')}>Raum fertig<//></div>
    </div>
    ${suche && html`<${LvSuche} r=${r} onAdd=${x => { addL(x); setSuche(false); }} onClose=${() => setSuche(false)} />`}
    ${gross && html`<div className="sheet-bg dunkelbg" onClick=${() => setGross(null)}><img className="grossbild" src=${gross.large || gross.thumb} alt=${gross.name} /><div className="bildname">${gross.name}</div></div>`}
  </div>`;
}

  const ausloesen = () => { const v = vid.current; if (!v || !v.videoWidth) return; const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0); c.toBlob(b => b && ablegen(b), 'image/jpeg', 0.92); };
  const dateien = async e => { const fs = Array.from(e.target.files || []); e.target.value = ''; for (const x of fs) if (/^image\//.test(x.type) || /\.(jpe?g|png|heic|heif)$/i.test(x.name)) await ablegen(x); };
  return html`<div className="kam">
    <div className="kam-kopf">
      <button className="rund hell" aria-label="Kamera schließen" onClick=${onClose}><${Icon} n="back" /></button>
      <div className="kam-ziel"><small>${kopf || 'Kein Akt am iPad geöffnet'}</small><b>${ziel ? ziel.label : '—'}</b></div>
      ${folgt && html`<button className=${'pille ' + (folgen && live ? 'blau' : 'grau')} onClick=${() => setFolgen(!folgen)}>${folgen ? (live ? 'folgt iPad' : 'wartet auf iPad') : 'manuell'}</button>`}
    </div>
    <div className="kam-bild">
      <video ref=${vid} playsInline=${true} muted=${true} autoPlay=${true} />
      ${kamOk === false && html`<div className="kam-info">Die Live-Kamera ist hier nicht freigegeben. Unten „Kamera-App“ verwenden, das funktioniert immer.</div>`}
      ${folgt && !live && html`<div className="kam-info">Am iPad einen Akt öffnen. Dieses iPhone übernimmt dann Akt und Raum von selbst.</div>`}
      ${blitz && html`<div className="blitz"></div>`}
    </div>
    <div className="kam-chips">${zl.map(z => html`<button key=${z.key} className=${'kchip' + (ziel && z.key === ziel.key ? ' on' : '')} onClick=${() => { setFolgen(false); setSel(z.key); }}>${z.label}</button>`)}</div>
    <input className="kam-wort" aria-label="Stichwort für die nächsten Fotos" placeholder="Stichwort für die nächsten Fotos (optional), z. B. Quellung Parkett" value=${wort} onChange=${e => setWort(e.target.value)} />
    <div className="kam-fuss">
      <div className="kam-zahl">${letztes ? html`<img src=${letztes} alt="" />` : html`<span></span>`}<small>${zahl} neu${queue.count ? ' · ' + queue.count + ' ↑' : ''}</small></div>
      <button className="ausloeser" aria-label="Foto aufnehmen" disabled=${!akt || !ziel} onClick=${() => kamOk ? ausloesen() : natRef.current.click()}><span></span></button>
      <div className="kam-neben">
        <button className="kbtn" disabled=${!akt} onClick=${() => natRef.current.click()}>Kamera-App</button>
        <button className="kbtn" disabled=${!akt} onClick=${() => albRef.current.click()}>Mediathek</button>
      </div>
    </div>
    ${queue.lastError && queue.count > 0 && html`<div className="kam-fehler">Upload wartet: ${queue.lastError}</div>`}
    <input ref=${natRef} type="file" accept="image/*" capture="environment" hidden=${true} onChange=${dateien} />
    <input ref=${albRef} type="file" accept="image/*" multiple=${true} hidden=${true} onChange=${dateien} />
  </div>`;
}

/* ---------- App ---------- */
function App() {
  const [cfg, setCfgS] = useState(() => ({ ...DEFAULT_CFG, ...lsGet(K.cfg, {}) }));
  const [demo, setDemo] = useState(() => new URLSearchParams(location.search).has('demo') || lsGet('sfvo_demo_on', false));
  const [tok, setTok] = useState(() => !!Auth.get()), [me, setMe] = useState(null), [fehler, setFehler] = useState('');
  const [akten, setAkten] = useState(() => lsGet(K.akten, [])), [laden, setLaden] = useState(false), [listFehler, setListFehler] = useState('');
  const [view, setView] = useState({ m:'heute' }), [neu, setNeu] = useState(false), [msg, setMsg] = useState(''), [hinweise, setHinweise] = useState({}), [lose, setLose] = useState([]);
  const [queue, setQueue] = useState({ count:0, lastError:'' });
  const schmal = useMedia('(max-width: 820px)'), [neuV, setNeuV] = useState('');
  useEffect(() => { if (!/^https?:/.test(location.protocol)) return; const pruef = () => fetch(location.pathname + '?t=' + Date.now(), { cache:'no-store' }).then(r => r.ok ? r.text() : '').then(t => { const m = t.match(/APP_VERSION = '([^']+)'/); if (m && m[1] !== APP_VERSION) setNeuV(m[1]); }).catch(() => {}); pruef(); const t = setInterval(pruef, 15 * 60000); return () => clearInterval(t); }, []);
  const cloud = useMemo(() => { cache.root = null; cache.sub = {}; return demo ? demoCloud() : graphCloud(cfg); }, [demo, cfg.clientId, cfg.mode, cfg.driveId, cfg.root]);
  const verbunden = demo || tok;
  useEffect(() => { if (demo) window.__sfvoDemo = cloud; }, [demo, cloud]);
  const toast = t => { setMsg(t); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(''), 3200); };
  useEffect(() => Queue.sub(s => setQueue({ count:s.count, lastError:s.lastError })), []);
  useEffect(() => { (async () => { const q = new URLSearchParams(location.search), code = q.get('code'), err = q.get('error');
    if (err) { setFehler(q.get('error_description') || err); history.replaceState({}, '', redirectUri()); return; }
    if (code) { history.replaceState({}, '', redirectUri()); if (q.get('state') !== sessionStorage.getItem(K.state)) { setFehler('Anmeldung: Sicherheitsprüfung fehlgeschlagen. Bitte erneut anmelden.'); return; }
      try { Auth.set(await msToken(cfg, { grant_type:'authorization_code', code, redirect_uri:redirectUri(), code_verifier:sessionStorage.getItem(K.pkce) || '' })); setTok(true); } catch (e) { setFehler(e.message || String(e)); } } })(); }, []);
  const ladeAkten = useCallback(async () => { setLaden(true); setListFehler('');
    try { const l = await listAkten(cloud, demo ? { root:'Demo_Ablage' } : cfg);
      try { const plan = await readTagesplan(cloud, demo ? { root:'Demo_Ablage' } : cfg), ohne = [];
        if (plan && plan.datum === heute()) (plan.termine || []).forEach(t => { const a = t.akt && l.find(x => x.name === t.akt); if (a) { a.zeit = t.zeit || ''; a.terminOrt = t.ort || ''; if (a.status === 'offen') { a.status = 'tag'; a.geplant = true; } } else ohne.push(t); });
        setLose(ohne); } catch (e) { setLose([]); }
      setAkten(l); if (!demo) lsSet(K.akten, l);
      const hs = {}; for (const a of l.filter(x => x.status === 'tag').slice(0, 6)) { try { const n = (await cloud.kids(a.id)).map(k => k.name).join('|'); hs[a.id] = [
        /schadenmeldung|schadensanzeige|(^|\|)SM\d*\.pdf/i.test(n) ? { t:'Schadenmeldung liegt vor', ok:true } : { t:'Schadenmeldung fehlt', ok:false },
        /angebot|kostenvoranschlag/i.test(n) ? { t:'Angebot im Akt', ok:true } : null, /rechnung/i.test(n) ? { t:'Rechnung im Akt', ok:true } : null, /leckortung/i.test(n) ? { t:'Leckortung im Akt', ok:true } : null].filter(Boolean); } catch (e) {} }
      setHinweise(hs); }
    catch (e) { if (e.auth) { setTok(false); } else setListFehler((navigator.onLine ? '' : 'Offline. ') + (e.message || String(e)) + (akten.length ? ' Angezeigt wird der letzte Stand.' : '')); }
    setLaden(false); }, [cloud, demo, cfg.root]);
  useEffect(() => { if (!verbunden) return; Queue.setCloud(cloud); cloud.me().then(setMe).catch(() => {}); ladeAkten(); }, [verbunden, cloud]);
  const cfgRoot = demo ? { ...cfg, root:'Demo_Ablage' } : cfg;
  const setCfg = c => { const neuAnmelden = ['clientId', 'tenant', 'mode', 'driveId', 'scope'].some(k => c[k] !== cfg[k]); setCfgS(c); lsSet(K.cfg, c); if (neuAnmelden && !demo) { Auth.set(null); setTok(false); } };
  const startDemo = () => { lsSet('sfvo_demo_on', true); setDemo(true); setAkten([]); };
  const endDemo = () => { localStorage.removeItem('sfvo_demo_on'); localStorage.removeItem(K.demo); Object.keys(localStorage).filter(k => k.startsWith(K.fall + 'd')).forEach(k => localStorage.removeItem(k)); setDemo(false); setAkten(lsGet(K.akten, [])); setView({ m:'heute' }); };
  let inhalt;
  if (view.m === 'settings') inhalt = html`<${Einstellungen} cfg=${cfg} setCfg=${setCfg} me=${me} demo=${demo} onClose=${() => setView({ m:'heute' })} onLogout=${() => { Auth.set(null); setTok(false); setView({ m:'heute' }); }} onDemoReset=${endDemo} />`;
  else if (!verbunden) inhalt = html`<${Login} cfg=${cfg} fehler=${fehler} onDemo=${startDemo} onSettings=${() => setView({ m:'settings' })} />`;
  else if (view.m === 'kamera') inhalt = html`<${Kamera} cloud=${cloud} cfg=${cfgRoot} me=${me} folgt=${true} ziele=${[]} onClose=${() => setView({ m:'heute' })} queue=${queue} />`;
  else if (view.m === 'fall') inhalt = html`<${Fall} key=${view.akt.id} akt=${view.akt} cloud=${cloud} cfg=${cfgRoot} me=${me} schmal=${schmal} queue=${queue} toast=${toast} onClose=${() => { setView({ m:'heute' }); }}
    onAktMoved=${v => { if (v) setAkten(as => as.map(a => a.id === view.akt.id ? { ...a, status:'bes' } : a)); }} />`;
  else inhalt = html`<${Heute} me=${me} demo=${demo} lose=${lose} akten=${akten} laden=${laden} fehler=${listFehler} cfg=${cfg} hinweise=${hinweise} schmal=${schmal} queue=${queue} onReload=${ladeAkten}
    onOpen=${a => setView({ m:'fall', akt:a })} onKamera=${() => setView({ m:'kamera' })} onSettings=${() => setView({ m:'settings' })} onNeu=${() => setNeu(true)} />`;
  return html`<${React.Fragment}>
    ${neuV && view.m !== 'kamera' && html`<div className="demo-band neu">Neue Version ${neuV} ist verfügbar <button onClick=${() => location.replace(location.pathname + '?v=' + encodeURIComponent(neuV))}>Jetzt laden</button></div>`}
    ${demo && view.m !== 'kamera' && html`<div className="demo-band">Demo-Modus · Daten nur in diesem Browser <button onClick=${endDemo}>Beenden</button></div>`}
    ${inhalt}
    ${neu && html`<${NeuerAkt} onClose=${() => setNeu(false)} onCreate=${async a => { try { const akt = await createAkt(cloud, cfgRoot, a); setAkten(as => [akt].concat(as)); setNeu(false); setView({ m:'fall', akt }); } catch (e) { toast('Akt konnte nicht angelegt werden: ' + (e.message || e)); } }} />`}
    ${msg && html`<div className="toast" role="status">${msg}</div>`}
  <//>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
</body>
